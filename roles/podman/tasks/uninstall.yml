---
- name: Find deployed Quadlet units
  ansible.builtin.find:
    paths: /etc/containers/systemd
    patterns:
      - "*.container"
      - "*.pod"
      - "*.kube"
      - "*.network"
      - "*.volume"
  register: podman_quadlets

- name: Refuse to uninstall while Quadlet services are deployed
  ansible.builtin.assert:
    that: podman_quadlets.matched == 0
    fail_msg: >-
      Quadlet units still deployed: {{ podman_quadlets.files | map(attribute='path') | join(', ') }}.
      Remove services first (e.g. playbooks/nginx-destroy.yml).
    quiet: true

- name: Check whether podman is installed
  ansible.builtin.command: which podman
  register: podman_bin
  changed_when: false
  failed_when: false

- name: Remove all containers, images and volumes
  ansible.builtin.command: podman system reset --force
  when:
    - podman_purge_data | bool
    - podman_bin.rc == 0
  changed_when: true

- name: Remove netavark firewall driver override
  ansible.builtin.file:
    path: "{{ podman_firewall_conf }}"
    state: absent

- name: Purge podman packages and their auto-installed dependencies
  ansible.builtin.apt:
    name: "{{ podman_packages }}"
    state: absent
    purge: true
    autoremove: true

- name: Remove podman data and Quadlet directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ podman_data_paths }}"
  when: podman_purge_data | bool
